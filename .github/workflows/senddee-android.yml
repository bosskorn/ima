name: Senddee Android APK
on:
  workflow_dispatch:
  push:
    paths: ['senddee-app/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: senddee-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: senddee-app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run cap:sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: senddee-debug-apk, path: senddee-app/android/app/build/outputs/apk/debug/app-debug.apk }
